name: Automatic review

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: automatic-review-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.AI_PR_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Run the exact trusted revision that supplied this workflow. The PR head
      # is read through the GitHub API below and is never checked out or executed.
      - name: Checkout trusted workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Checkout upstream review guide
        uses: actions/checkout@v4
        with:
          repository: openblack/bw1-decomp
          ref: main
          path: upstream-guide
          sparse-checkout: AGENTS.md
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve current pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const candidates = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: run.head_sha,
            });
            const pr = candidates.find(p => p.state === 'open' && !p.draft &&
              p.head.sha === run.head_sha && p.head.repo?.full_name === context.repo.owner + '/' + context.repo.repo);
            if (!pr) return;
            core.setOutput('number', pr.number);
            core.setOutput('sha', pr.head.sha);

      - name: Download binary evidence from completed build
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: binary-evidence-*
          path: binary-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Find latest trusted RepoScout index
        if: steps.pr.outputs.number != ''
        id: reposcout
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = await github.rest.repos.get({ owner, repo });
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'reposcout-index.yml',
              branch: repository.data.default_branch, status: 'success', per_page: 10,
            });
            const run = runs.data.workflow_runs.find(r =>
              ['push', 'schedule', 'workflow_dispatch'].includes(r.event));
            if (run) core.setOutput('run_id', run.id);

      - name: Download RepoScout index
        if: steps.reposcout.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: reposcout-index
          path: reposcout-index
          run-id: ${{ steps.reposcout.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Review pull request
        if: steps.pr.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_REVIEW_EXPECTED_SHA: ${{ steps.pr.outputs.sha }}
          PR_REVIEW_EVIDENCE_DIR: binary-evidence
          PR_REVIEW_REPOSCOUT_DB: reposcout-index/index.sqlite3
          PR_REVIEW_BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PR_REVIEW_API_KEY: ${{ secrets.PR_REVIEW_API_KEY }}
          PR_REVIEW_API_BASE: ${{ vars.PR_REVIEW_API_BASE || 'https://api.openai.com/v1' }}
          PR_REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL || 'gpt-6-luna' }}
          PR_REVIEW_INSTRUCTIONS: tools/automatic_pr_review_instructions.md
          PR_REVIEW_GUIDE: upstream-guide/AGENTS.md
        run: python tools/automatic_pr_review.py
