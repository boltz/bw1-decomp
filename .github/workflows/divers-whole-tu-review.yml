name: LH3DDivers whole TU readability
on:
  push:
    branches: [review/lh3ddivers-readable-climb-20261109]
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'boltz/bw1-decomp'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install PyYAML==6.0.3
      - name: Check complete function inventory
        run: python -m unittest discover -s tools/tests -p test_divers_function_inventory.py -v
      - name: Review pinned whole TU
        env:
          TARGET_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_REVIEW_API_KEY: ${{ secrets.PR_REVIEW_API_KEY }}
          PR_REVIEW_API_BASE: ${{ vars.PR_REVIEW_API_BASE || 'https://api.openai.com/v1' }}
          PR_REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL || 'gpt-6-luna' }}
        run: python tools/divers_whole_tu_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: divers-whole-tu-review
          path: whole-tu-*.json
