name: Build evidence report

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: build-evidence-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'boltz/bw1-decomp' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve current pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const candidates = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: run.head_sha,
            });
            const pr = candidates.find(p => p.state === 'open' && !p.draft &&
              p.head.sha === run.head_sha && p.head.repo?.full_name === context.repo.owner + '/' + context.repo.repo);
            if (!pr) return;
            core.setOutput('number', pr.number);
            core.setOutput('sha', pr.head.sha);

      - name: Download binary evidence from completed build
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: binary-evidence-*
          path: binary-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Report build and binary evidence
        if: steps.pr.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_REVIEW_EXPECTED_SHA: ${{ steps.pr.outputs.sha }}
          PR_REVIEW_EVIDENCE_DIR: binary-evidence
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python tools/build_evidence_report.py
